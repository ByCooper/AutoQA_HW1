plugins {
    id 'java'
}

group = 'inno.tech'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation("com.fasterxml.jackson.core:jackson-core:2.22.4")
    testImplementation("org.assertj:assertj-core:3.27.7")
    implementation("io.rest-assured:rest-assured:6.0.1")
    // Source: https://mvnrepository.com/artifact/com.codeborne/selenide
    implementation("com.codeborne:selenide:7.19.0")
}
/**
 * Запуск теста по тегу - в терминале ввести команду ./gradlew test -Ptags='one'
 */
tasks.test {
    useJUnitPlatform() {
        includeTags("one", "api")
    }
}